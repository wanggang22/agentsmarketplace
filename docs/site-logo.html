<!DOCTYPE html>
<html>
<head><title>Site Logo Export</title></head>
<body style="margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#fff">
<!-- 400x400 版本，右键另存为图片 -->
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="80" fill="url(#g)"/>
  <text x="200" y="280" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,sans-serif" font-weight="800" font-size="260" fill="white">X</text>
</svg>
</body>
</html>
